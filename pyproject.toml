[project]
name = "tix-infra"
version = "0.1.0"
description = "Independent Python infrastructure building blocks"
requires-python = ">=3.11"
dependencies = ["tix-config", "tix-asyncio", "tix-transition", "tix-lifecycle"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tix-config", "tix-asyncio", "tix-transition", "tix-lifecycle"]

[tool.uv.sources]
tix-config = { workspace = true }
tix-asyncio = { workspace = true }
tix-transition = { workspace = true }
tix-lifecycle = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "trio>=0.27,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tix-config/src", "tix-asyncio/src", "tix-transition/src", "tix-lifecycle/src"]

[[tool.mypy.overrides]]
module = ["transitions.*", "yaml"]
ignore_missing_imports = true
