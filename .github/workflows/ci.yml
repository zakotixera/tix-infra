name: Python packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --all-packages --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/typecheck.py
      - run: uv run pytest --cov=tix_config --cov=tix_asyncio --cov=tix_transition --cov=tix_lifecycle --cov-fail-under=90
      - run: uv run python examples/service.py
      - run: uv build --all-packages
      - run: uv run python scripts/check_wheels.py --python ${{ matrix.python }}
