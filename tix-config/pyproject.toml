[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tix-config"
version = "0.1.0"
description = "Layered local configuration with immutable, validated snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6,<7"]

[tool.setuptools]
packages = ["tix_config"]
package-dir = { tix_config = "src/config" }

[tool.setuptools.package-data]
tix_config = ["py.typed"]
