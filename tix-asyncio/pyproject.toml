[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tix-asyncio"
version = "0.1.0"
description = "Bounded structured concurrency and resilience on AnyIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anyio>=4.4,<5"]

[tool.setuptools]
packages = ["tix_asyncio"]
package-dir = { tix_asyncio = "src/asyncio" }

[tool.setuptools.package-data]
tix_asyncio = ["py.typed"]
